<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎈 우리 반 앱 진열장</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Jua & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      /* 배경 이미지 설정: 화면 꽉 차게(cover), 고정 배경(fixed), 중앙 정렬 */
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .font-jua {
      font-family: 'Jua', sans-serif;
    }
    /* 둥둥 떠있는 둥글둥글 애니메이션 */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animate-float {
      animation: float 4s ease-in-out infinite;
    }
    /* 카드 호버 효과 */
    .app-card {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .app-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 25px -5px rgba(255, 182, 193, 0.4), 0 8px 10px -6px rgba(255, 182, 193, 0.2);
    }
  </style>
</head>
<body class="min-h-screen relative text-slate-700">

  <!-- 
    ==================================================
    ⚪ 배경 그림 위의 연한 흰색 반투명 막 (White Overlay)
    글씨와 카드가 돋보이도록 해줍니다.
    ==================================================
  -->
  <div class="fixed inset-0 bg-white/70 backdrop-blur-[2px] pointer-events-none z-0"></div>

  <!-- 메인 컨텐츠 영역 (z-index로 반투명 막 위에 배치) -->
  <div class="relative z-10 min-h-screen pb-16">

    <!-- ========================================== -->
    <!-- 📌 스크립트: 앱 목록 데이터 설정 영역     -->
    <!-- ========================================== -->
    <script>
      /**
       * 💡 [선생님 전용 앱 목록 설정]
       * 아래 APP_LIST 배열에 새로운 앱을 { title, description, url, icon, tag, badgeColor } 형식으로 한 줄만 추가하면
       * 화면에 예쁜 카드가 자동으로 생성됩니다!
       */
      const APP_LIST = [
        {
          title: "동물 분류 탐정",
          description: "동물들의 특징을 살펴보고 스스로 분류해 보는 재미있는 과학 탐구 활동!",
          url: "https://gemini.google.com/share/ef8ddfaf4dd1",
          icon: "🦁",
          tag: "과학",
          badgeColor: "bg-emerald-100 text-emerald-800 border border-emerald-200"
        },
        {
          title: "태양계 행성 탐험 도감",
          description: "우주 속 신비한 태양계 행성들을 탐험하고 알아보는 시간!",
          url: "planets.html",
          icon: "🪐",
          tag: "우주·과학",
          badgeColor: "bg-purple-100 text-purple-800 border border-purple-200"
        },
        {
          title: "수업 이해도 신호등",
          description: "오늘 수업 내용을 얼마나 이해했는지 신호등으로 솔직하게 표현해 보아요.",
          url: "https://goodteacher.my.canva.site/cn6yfa7tj1g84afr",
          icon: "🚦",
          tag: "학급활동",
          badgeColor: "bg-rose-100 text-rose-800 border border-rose-200"
        }
        // ✏️ 여기에 새 앱을 한 줄씩 추가하시면 됩니다!
      ];
    </script>

    <!-- 메인 헤더 영역 -->
    <header class="pt-10 pb-6 px-4 text-center">
      <div class="max-w-4xl mx-auto">
        <div class="inline-block px-4 py-1.5 mb-3 bg-white/90 backdrop-blur-md border border-pink-200 rounded-full text-pink-600 font-semibold text-sm shadow-sm animate-float">
          ✨ 즐겁고 신나는 우리 교실
        </div>
        <h1 class="font-jua text-4xl sm:text-5xl md:text-6xl text-slate-800 tracking-wide mb-3 drop-shadow-sm">
          🎈 우리 반 앱 진열장 🎈
        </h1>
        <p class="text-slate-600 text-base sm:text-lg font-semibold max-w-xl mx-auto">
          오늘 수업에 필요한 앱들을 한눈에 확인하고 터치해 보세요!
        </p>
      </div>
    </header>

    <!-- 검색 & 필터 영역 -->
    <div class="max-w-5xl mx-auto px-4 mb-8">
      <div class="relative max-w-md mx-auto">
        <input 
          type="text" 
          id="searchInput"
          placeholder="🔍 찾고 싶은 앱 이름이나 설명을 입력해요..." 
          class="w-full px-5 py-3.5 rounded-full border-2 border-pink-200 bg-white/95 backdrop-blur focus:outline-none focus:border-pink-400 shadow-md text-slate-700 placeholder-slate-400 text-sm sm:text-base transition-all"
          onkeyup="filterApps()"
        />
      </div>
    </div>

    <!-- 앱 카드가 배치될 그리드 레이아웃 -->
    <main class="max-w-6xl mx-auto px-4">
      <div 
        id="appGrid" 
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8"
      >
        <!-- JavaScript를 통해 이 곳에 카드가 생성됩니다 -->
      </div>

      <!-- 검색 결과 없음 메세지 -->
      <div id="emptyMessage" class="hidden text-center py-16">
        <div class="text-5xl mb-3">🐱❓</div>
        <p class="text-slate-600 font-medium text-lg bg-white/80 inline-block px-6 py-2 rounded-full border border-pink-200 shadow-sm">
          찾으시는 앱이 없어요. 다시 검색해 볼까요?
        </p>
      </div>
    </main>

    <!-- 하단 푸터 -->
    <footer class="mt-20 text-center text-xs sm:text-sm text-slate-500 font-semibold">
      <p class="inline-block bg-white/70 px-4 py-2 rounded-full border border-slate-200/60 shadow-sm">
        🌱 우리 반을 위한 배움터 | 깨끗하고 안전한 디지털 교실 ☀️
      </p>
    </footer>

  </div>

  <!-- 카드 동적 생성 및 검색 스크립트 -->
  <script>
    // 앱 그리드에 카드 렌더링 함수
    function renderApps(apps) {
      const grid = document.getElementById('appGrid');
      const emptyMsg = document.getElementById('emptyMessage');
      
      grid.innerHTML = '';

      if (apps.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      } else {
        emptyMsg.classList.add('hidden');
      }

      apps.forEach(app => {
        // 카드 HTML 요소 생성
        const cardAnchor = document.createElement('a');
        cardAnchor.href = app.url;
        cardAnchor.target = '_blank'; // 새 탭에서 열기
        cardAnchor.rel = 'noopener noreferrer'; // 보안 최적화
        cardAnchor.className = 'app-card block bg-white/95 backdrop-blur border-2 border-pink-100 rounded-3xl p-6 shadow-md hover:border-pink-300 relative overflow-hidden group cursor-pointer';

        cardAnchor.innerHTML = `
          <!-- 우측 상단 태그 -->
          <span class="absolute top-4 right-4 px-3 py-1 rounded-full text-xs font-bold ${app.badgeColor || 'bg-slate-100 text-slate-700'} shadow-sm">
            ${app.tag || '앱'}
          </span>

          <div class="flex items-center space-x-4 mb-3">
            <!-- 이모지 아이콘 박스 -->
            <div class="w-16 h-16 sm:w-18 sm:h-18 flex items-center justify-center rounded-2xl bg-gradient-to-br from-pink-50 to-orange-50 border border-pink-100 text-3xl sm:text-4xl shadow-inner group-hover:scale-110 transition-transform">
              ${app.icon || '📌'}
            </div>
            
            <div>
              <h2 class="font-jua text-xl sm:text-2xl text-slate-800 group-hover:text-pink-600 transition-colors">
                ${app.title}
              </h2>
              <span class="inline-flex items-center text-xs font-bold text-pink-400 group-hover:translate-x-1 transition-transform">
                열기 ➔
              </span>
            </div>
          </div>

          <!-- 앱 설명 -->
          <p class="text-slate-600 text-sm leading-relaxed mt-2 line-clamp-2">
            ${app.description}
          </p>
        `;

        grid.appendChild(cardAnchor);
      });
    }

    // 간단한 실시간 검색 기능
    function filterApps() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = APP_LIST.filter(app => 
        app.title.toLowerCase().includes(query) || 
        app.description.toLowerCase().includes(query) ||
        (app.tag && app.tag.toLowerCase().includes(query))
      );
      renderApps(filtered);
    }

    // 초기 로딩 시 카드 생성
    document.addEventListener('DOMContentLoaded', () => {
      renderApps(APP_LIST);
    });
  </script>
</body>
</html>
